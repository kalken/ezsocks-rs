# Builds the flake's package for x86_64-linux and aarch64-linux and pushes it
# to Cachix. Only runs when started by hand (Actions > Build cache > Run
# workflow).
#
# Needs the repository variable CACHIX_CACHE (the cache name) and the secret
# CACHIX_AUTH_TOKEN.
name: Build cache

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: ${{ vars.CACHIX_CACHE }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix build --print-build-logs .#default
