[package]
name = "ezsocks"
version = "0.1.0"
edition = "2021"
description = "Small SOCKS5 proxy with Happy Eyeballs"
license = "MIT"
publish = false

[dependencies]
libc = "0.2"
socket2 = { version = "0.6", features = ["all"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "time", "io-util", "signal", "sync", "macros"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
